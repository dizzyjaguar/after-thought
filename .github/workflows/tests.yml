name: Tests

# Runs on pull requests into main from other people. The owner runs tests locally,
# and can still start a run by hand from the Actions tab.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# `pull_request` (not `pull_request_target`) keeps runs from forks read-only, with no secrets.
permissions:
  contents: read

jobs:
  editor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # also type-checks

  app:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != github.repository_owner
    # Needs the macOS 26 SDK (for Liquid Glass).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path mac
